# BEGIN COMIC DRAMA
server {
    listen 80;
    server_name comic-drama.nexusapi.center;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://comic-drama.nexusapi.center$request_uri; }
}
server {
    listen 443 ssl;
    server_name comic-drama.nexusapi.center;
    ssl_certificate /etc/letsencrypt/live/comic-drama.nexusapi.center/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comic-drama.nexusapi.center/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $comic_drama_upstream comic-drama:5680;
        proxy_pass http://$comic_drama_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
# END COMIC DRAMA
