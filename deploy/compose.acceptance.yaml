# Local acceptance only. Use a separate Compose project name and fresh volumes.
# docker compose -p minidrama-acceptance -f compose.yaml -f compose.acceptance.yaml up -d
services:
  app:
    environment:
      PUBLIC_ORIGIN: https://localhost:18443
      ALLOW_REGISTRATION: ${ACCEPTANCE_ALLOW_REGISTRATION:-true}
  caddy:
    ports: !override
      - '127.0.0.1:18080:80'
      - '127.0.0.1:18443:443'
    volumes:
      - ./Caddyfile.acceptance:/etc/caddy/Caddyfile:ro
  backup:
    volumes:
      - ./backups/acceptance:/backups
