<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><rect width="1400" height="720" fill="#111517"/><text x="60" y="68" fill="#f3eee6" font-family="Arial" font-size="28" font-weight="700">布局策略：按镜头为主，局部滚动为辅</text><text x="60" y="102" fill="#91a09a" font-family="Arial" font-size="14">避免整页无限向下滚动，也避免把所有信息压缩在一个固定面板里</text><rect x="60" y="152" width="410" height="470" rx="12" fill="#171d1f" stroke="#394647"/><text x="88" y="194" fill="#e2a665" font-family="Arial" font-size="16" font-weight="700">左侧：镜头队列</text><rect x="88" y="226" width="354" height="64" rx="7" fill="#34291f" stroke="#d99a5b"/><text x="108" y="254" fill="#f3eee6" font-family="Arial" font-size="13">#04　递出票根　10s</text><text x="108" y="276" fill="#55c2a5" font-family="Arial" font-size="11">已完成　当前选中</text><text x="108" y="338" fill="#a5b1ab" font-family="Arial" font-size="13">#05　抬头确认身份　8s</text><text x="108" y="398" fill="#a5b1ab" font-family="Arial" font-size="13">#06　店内短暂沉默　10s</text><text x="88" y="568" fill="#72817c" font-family="Arial" font-size="11">此列独立滚动，镜头多时不会撑长页面</text><rect x="510" y="152" width="520" height="470" rx="12" fill="#171d1f" stroke="#394647"/><text x="538" y="194" fill="#e2a665" font-family="Arial" font-size="16" font-weight="700">中央：当前镜头工作区</text><rect x="538" y="224" width="464" height="190" rx="7" fill="#0d1112"/><rect x="560" y="246" width="420" height="146" fill="#67584d"/><text x="538" y="456" fill="#f3eee6" font-family="Arial" font-size="14" font-weight="700">视频预览 / 首帧 / 尾帧</text><text x="538" y="485" fill="#a5b1ab" font-family="Arial" font-size="11">当前镜头的动作、对白和生成状态集中在这里</text><rect x="538" y="520" width="464" height="54" rx="6" fill="#202829"/><text x="560" y="553" fill="#9ba8a2" font-family="Arial" font-size="11">向下滚动查看本镜头的更多信息</text><rect x="1070" y="152" width="270" height="470" rx="12" fill="#171d1f" stroke="#394647"/><text x="1098" y="194" fill="#e2a665" font-family="Arial" font-size="16" font-weight="700">右侧：固定检查栏</text><text x="1098" y="238" fill="#a5b1ab" font-family="Arial" font-size="11">提示词规则</text><text x="1098" y="268" fill="#f3eee6" font-family="Arial" font-size="13">Skill v1.8.1</text><line x1="1098" y1="290" x2="1310" y2="290" stroke="#394647"/><text x="1098" y="330" fill="#a5b1ab" font-family="Arial" font-size="11">提交前检查</text><text x="1098" y="360" fill="#55c2a5" font-family="Arial" font-size="12">✓ 时长一致</text><text x="1098" y="390" fill="#55c2a5" font-family="Arial" font-size="12">✓ 图片绑定</text><text x="1098" y="420" fill="#55c2a5" font-family="Arial" font-size="12">✓ 规则已启用</text><rect x="1098" y="482" width="212" height="42" rx="6" fill="#d99a5b"/><text x="1152" y="508" fill="#1b1713" font-family="Arial" font-size="12" font-weight="700">提交视频</text><text x="60" y="674" fill="#91a09a" font-family="Arial" font-size="13">其它页面：项目列表、剧集详情、AI 配置、规则包、媒体库、自由创作采用普通页面滚动；只有分镜工作台需要“镜头队列独立滚动”。</text></svg>
